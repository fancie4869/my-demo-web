        .info-value {
            color: #333;
            flex: 1;
            word-break: break-all;
        }
        .footer {
            text-align: center;
            padding: 40px 16px 30px;
            font-size: 14px;
            color: #333;
            background-color: #fff;
            margin-top: 10px;
